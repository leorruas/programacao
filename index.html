<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>programação — wiki</title>
    <link rel="stylesheet" href="style.css?v=estrutura-v35">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
</head>

<body>
    <nav class="sticky-nav">
        <button class="nav-logo" onclick="scrollToTop()">pesquisa de programação</button>
        <div class="nav-search-container">
            <input type="text" id="main-search-input" placeholder="buscar em tudo..." autocomplete="off">
            <div id="main-search-results" class="nav-search-dropdown"></div>
        </div>
        <button class="nav-pastas-btn" onclick="scrollToPastas()">pastas</button>
        <button class="nav-theme-btn" id="theme-toggle" title="alternar tema">◐</button>
    </nav>

    <main>
        <section class="hero page-masthead">
            <div class="masthead-copy">
                <p class="eyebrow">wiki pessoal</p>
                <h1>programação</h1>
                <p class="intro">
                    base de conhecimento sobre desenvolvimento de software, organizada para estudo e consulta rápida.
                </p>
            </div>
        </section>

        <section class="explorar-pastas" id="pastas">
            <div class="section-header">
                <p class="section-kicker">explorar por assunto</p>
                <h2>pastas</h2>
            </div>
            <div class="pastas-container" id="pastas-container">
                <div class="loading">carregando pastas...</div>
            </div>
        </section>

        <section class="busca-section" id="busca-section">
            <div class="section-header">
                <p class="section-kicker">pesquisa global</p>
                <h2>buscar</h2>
            </div>
            <div class="busca-container">
                <input type="text" id="busca-input" placeholder="digite um termo..." autocomplete="off">
            </div>
            <div id="resultados-container"></div>
        </section>
    </main>

    <script>
        (function () {
            function suportaAppModerno() {
                try {
                    new Function("var x = { a: { b: 1 } }; return x?.a?.b;");
                    new Function("return /(?<!a)b/.test(\"b\");");
                    return true;
                } catch (erro) {
                    return false;
                }
            }

            function carregarScript(src, tipo, aoCarregar) {
                var script = document.createElement("script");
                script.src = src;
                if (tipo) script.type = tipo;
                if (aoCarregar) script.onload = aoCarregar;
                document.body.appendChild(script);
            }

            function carregarCss(href) {
                var link = document.createElement("link");
                link.rel = "stylesheet";
                link.href = href;
                document.head.appendChild(link);
            }

            if (suportaAppModerno()) {
                carregarScript("https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js", null, function () {
                    carregarScript("script.js?v=estrutura-v36", "module");
                });
            } else {
                document.documentElement.className += " legacy-ios12";
                carregarCss("compat-ios12.css?v=ios12-3");
                carregarScript("legacy-ios12.js?v=ios12-2");
            }
        }());
    </script>
</body>

</html>
