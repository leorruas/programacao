<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>

<body>
    <header>
        <h1> pesquisa de programação</h1>

    </header>
    <main>
        <input type="text" placeholder="o que você quer pesquisar hoje? ">
        <button>Pesquisar</button>
        <div class="pastas-container" id="pastas-container">
            <!-- As pastas serão listadas aqui dinamicamente -->
        </div>
        <div class="resultados">
            <div class="cards-container">
                <!-- resultados -->
            </div>
        </div>
        <div class="leitor-artigo escondido" id="leitor-artigo">

            <h2 id="artigo-titulo"></h2>
            <div id="artigo-corpo" class="artigo-corpo"></div>
            <button id="btn-voltar" class="btn-voltar">&larr; voltar para a busca </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
