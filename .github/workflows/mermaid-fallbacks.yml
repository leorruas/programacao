name: Gerar fallbacks SVG do Mermaid

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/generate-mermaid-fallbacks.mjs"
      - "package.json"
      - ".github/workflows/mermaid-fallbacks.yml"

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar Mermaid CLI
        run: npm install --no-package-lock --ignore-scripts=false

      - name: Gerar SVGs
        run: npm run mermaid:fallbacks

      - name: Commitar SVGs atualizados
        run: |
          if [ -z "$(git status --porcelain -- assets/mermaid)" ]; then
            echo "Nenhum SVG alterado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mermaid
          git commit -m "build: atualizar fallbacks SVG do Mermaid"
          git push
